[tool.poetry]
name = "aithlete-backend"
version = "0.0.0"
description = "FastAPI backend for the aithlete AI training coach"
authors = ["Pascal Müller <mup0117@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.111.0"
uvicorn = { extras = ["standard"], version = ">=0.29.0" }
httpx = ">=0.27.0"
anthropic = ">=0.28.0"
python-dotenv = ">=1.0.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
mcp = ">=1.0.0"
keyring = ">=25.0.0"
cryptography = ">=42.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.0"
pdoc = "^16.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
